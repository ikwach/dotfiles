"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface1)\
$os\
$username\
[](bg:peach fg:surface1)\
$directory\
${custom.git_clean}\
${custom.git_dirty}\
${custom.git_none}\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:surface1 fg:text"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface1 fg:text"
style_root = "bg:surface1 fg:text"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"workspace" = "󰲋 "

# p10k-style signalling: the whole git block is green while the tree is clean and
# flips to yellow the moment git has something to report. starship cannot switch a
# module's background on state, so the branch chip is drawn by two custom modules
# under complementary `when` guards -- exactly one of them ever fires.
#
# The guards have to agree with what git_status renders, or the chip and the
# markers disagree on colour: hence ahead/behind and stashes count as dirty even
# though both leave the worktree listing empty. The guards run in parallel with
# starship's own git scan, so a normal repo pays ~3ms; a repo full of large
# binaries pays for a second `git status` and more like +18ms, because git
# re-hashes them whenever the stat cache is cold. --no-optional-locks keeps the
# extra call from ever writing or locking the index.
[custom.git_clean]
require_repo = true
shell = ["sh"]
command = 'git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD 2>/dev/null'
format = '[](fg:peach bg:green)[  $output ](fg:crust bg:green)'
when = '''
s=$(git --no-optional-locks status --porcelain --branch 2>/dev/null) || exit 1
[ "$(printf '%s\n' "$s" | wc -l)" -gt 1 ] && exit 1
case "$s" in *'['*) exit 1 ;; esac
git rev-parse --verify --quiet refs/stash >/dev/null && exit 1
exit 0
'''

[custom.git_dirty]
require_repo = true
shell = ["sh"]
command = 'git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD 2>/dev/null'
format = '[](fg:peach bg:yellow)[  $output ](fg:crust bg:yellow)'
when = '''
s=$(git --no-optional-locks status --porcelain --branch 2>/dev/null) || exit 1
[ "$(printf '%s\n' "$s" | wc -l)" -gt 1 ] && exit 0
case "$s" in *'['*) exit 0 ;; esac
git rev-parse --verify --quiet refs/stash >/dev/null && exit 0
exit 1
'''

# outside a repo neither chip fires, so nothing would bridge the directory's peach
# to the language block's green -- this draws that one separator and nothing else
[custom.git_none]
shell = ["sh"]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "true"
format = '[](fg:peach bg:green)'

[git_status]
style = "bg:yellow"
# only reached when git_dirty fired, so the chip is already yellow; this appends
# the markers and closes the block back out to the language segment's green
format = '([ $all_status$ahead_behind ](fg:crust bg:yellow)[](fg:yellow bg:green))'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
# only show the node version where an explicit .nvmrc pins it
detect_files = [".nvmrc"]
detect_extensions = []
detect_folders = []

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = false
min_time_to_notify = 45000

