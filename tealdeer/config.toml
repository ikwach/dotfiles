# tealdeer configuration (linked to ~/Library/Application Support/tealdeer/config.toml)
# Colors: catppuccin mocha

[style.description]
foreground = { rgb = [205, 214, 244] }  # text

[style.command_name]
foreground = { rgb = [250, 179, 135] }  # peach
bold = true

[style.example_text]
foreground = { rgb = [166, 173, 200] }  # subtext0

[style.example_code]
foreground = { rgb = [137, 220, 235] }  # sky
bold = true

[style.example_variable]
foreground = { rgb = [245, 194, 231] }  # pink
underline = true

[display]
compact = false
use_pager = false
show_title = false

[updates]
auto_update = true
auto_update_interval_hours = 720
archive_source = "https://github.com/tldr-pages/tldr/releases/latest/download/"
tls_backend = "rustls-with-webpki-roots"
